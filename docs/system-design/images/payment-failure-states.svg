<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="940" viewBox="0 0 1200 940" role="img" aria-labelledby="t d">
<title id="t">Payment attempt states and failure stages</title><desc id="d">State machine of a payment attempt (initiated, pending confirmation, authorized, captured, refunded, failed) and a table of the nine failure stages with detection, customer message and retry policy.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#111"/></marker></defs>
<style>text{font-family:'Instrument Sans',system-ui,sans-serif;fill:#111}.h{font-size:15px;font-weight:600}.t{font-size:12.5px}.s{font-size:11.5px;fill:#494540}.o{font-size:10.5px;font-weight:600;letter-spacing:.12em;fill:#494540}
.box{fill:#fff;stroke:#E6DDD5;stroke-width:1.5}.e{stroke:#111;stroke-width:1.5;fill:none;marker-end:url(#a)}.mono{font-family:ui-monospace,Consolas,monospace;font-size:12.5px;font-weight:600}</style>
<rect width="1200" height="940" fill="#FCFAF7"/>
<text x="40" y="44" class="h" style="font-size:22px">Payment attempt states and failure stages</text>
<text x="40" y="66" class="s">payment_attempts.status follows the SRS Payment states. On failure, failure_stage records where it failed. Retries always create a new attempt; they never reuse one.</text>
<rect x="40" y="150" width="170" height="52" rx="12" class="box"/><text x="125" y="181" class="h" text-anchor="middle">initiated</text>
<rect x="300" y="86" width="190" height="52" rx="12" fill="#fff" stroke="#494540" stroke-width="1.5" stroke-dasharray="5 4"/><text x="395" y="110" class="h" text-anchor="middle">pending confirm</text><text x="395" y="128" class="s" text-anchor="middle">UI state: client said success</text>
<rect x="300" y="186" width="150" height="52" rx="12" class="box"/><text x="375" y="217" class="h" text-anchor="middle">authorized</text>
<rect x="580" y="136" width="170" height="52" rx="12" fill="#FFA273" stroke="#F47A4A" stroke-width="1.5"/><text x="665" y="167" class="h" text-anchor="middle">captured</text>
<rect x="850" y="96" width="200" height="46" rx="12" class="box"/><text x="950" y="124" class="h" text-anchor="middle">refunded</text>
<rect x="850" y="182" width="200" height="46" rx="12" class="box"/><text x="950" y="210" class="h" text-anchor="middle">partially_refunded</text>
<rect x="40" y="276" width="760" height="40" rx="10" fill="#F7F0E9" stroke="#C43D3D" stroke-width="1.5"/><text x="56" y="301" class="h">failed</text><text x="110" y="301" class="s">failure_stage + failure_code + failure_reason · order stays pending_payment and the reservation is kept until its TTL</text>
<path d="M210 166C250 140 262 116 296 112" class="e"/><text x="206" y="132" class="s">client success</text>
<path d="M210 186C250 200 262 210 296 212" class="e"/><text x="214" y="228" class="s">payment.authorized</text>
<path d="M490 108C540 108 560 130 578 150" class="e"/><text x="498" y="98" class="s">webhook / reconcile</text>
<path d="M450 212C520 212 550 190 578 176" class="e"/><text x="462" y="232" class="s">auto-capture</text>
<path d="M750 152C800 140 815 124 846 120" class="e"/>
<path d="M750 172C800 184 815 200 846 204" class="e"/>
<path d="M125 202V272" class="e"/><text x="134" y="252" class="s">8 stages ↓</text>
<path d="M375 238V272" class="e"/><text x="382" y="262" class="s">capture_failed</text>
<path d="M480 138V160H540V272" class="e"/><text x="548" y="262" class="s">webhook_timeout</text>
<text x="820" y="292" class="s">Refunds: POST /api/admin/orders/[id]/refunds</text>
<text x="820" y="310" class="s">Duplicate capture → automatic refund</text>
<text x="40" y="350" class="o">FAILURE STAGE</text>
<text x="250" y="350" class="o">DETECTED BY</text>
<text x="560" y="350" class="o">CUSTOMER SEES</text>
<text x="960" y="350" class="o">RETRY</text>
<rect x="40" y="364" width="1120" height="50" rx="10" fill="#fff" stroke="#E6DDD5"/>
<rect x="40" y="364" width="6" height="50" rx="3" fill="#FFA273"/>
<text x="58" y="394" class="mono">order_creation</text>
<text x="250" y="394" class="t">createOrder() error or 8 s timeout</text>
<text x="560" y="394" class="t">“Gateway not responding. Try again or pick another method.”</text>
<text x="960" y="394" class="t" font-weight="600">New attempt, any method</text>
<rect x="40" y="420" width="1120" height="50" rx="10" fill="#F7F0E9" stroke="#E6DDD5"/>
<rect x="40" y="420" width="6" height="50" rx="3" fill="#FFA273"/>
<text x="58" y="450" class="mono">checkout_open</text>
<text x="250" y="450" class="t">script / modal / redirect failed to open</text>
<text x="560" y="450" class="t">“We couldn’t open the payment window.”</text>
<text x="960" y="450" class="t" font-weight="600">Retry</text>
<rect x="40" y="476" width="1120" height="50" rx="10" fill="#fff" stroke="#E6DDD5"/>
<rect x="40" y="476" width="6" height="50" rx="3" fill="#FFA273"/>
<text x="58" y="506" class="mono">user_cancelled</text>
<text x="250" y="506" class="t">modal dismissed · PayU cancel</text>
<text x="560" y="506" class="t">“Payment not completed. Your bag is saved.”</text>
<text x="960" y="506" class="t" font-weight="600">Retry now</text>
<rect x="40" y="532" width="1120" height="50" rx="10" fill="#F7F0E9" stroke="#E6DDD5"/>
<rect x="40" y="532" width="6" height="50" rx="3" fill="#FFA273"/>
<text x="58" y="562" class="mono">bank_declined</text>
<text x="250" y="562" class="t">payment.failed (issuer / funds)</text>
<text x="560" y="562" class="t">“Your bank declined it. No money was taken.”</text>
<text x="960" y="562" class="t" font-weight="600">Retry · suggest other method</text>
<rect x="40" y="588" width="1120" height="50" rx="10" fill="#fff" stroke="#E6DDD5"/>
<rect x="40" y="588" width="6" height="50" rx="3" fill="#FFA273"/>
<text x="58" y="618" class="mono">otp_timeout</text>
<text x="250" y="618" class="t">3DS / OTP step timed out</text>
<text x="560" y="618" class="t">“The OTP step timed out. No money was taken.”</text>
<text x="960" y="618" class="t" font-weight="600">Retry</text>
<rect x="40" y="644" width="1120" height="50" rx="10" fill="#F7F0E9" stroke="#E6DDD5"/>
<rect x="40" y="644" width="6" height="50" rx="3" fill="#C43D3D"/>
<text x="58" y="674" class="mono">signature_mismatch</text>
<text x="250" y="674" class="t">HMAC / hash / amount mismatch</text>
<text x="560" y="674" class="t">“Confirming your payment…” (never shown as paid)</text>
<text x="960" y="674" class="t" font-weight="600">Blocked until reconcile</text>
<rect x="40" y="700" width="1120" height="50" rx="10" fill="#fff" stroke="#E6DDD5"/>
<rect x="40" y="700" width="6" height="50" rx="3" fill="#C43D3D"/>
<text x="58" y="730" class="mono">webhook_timeout</text>
<text x="250" y="730" class="t">no webhook 10 min after client success</text>
<text x="560" y="730" class="t">“We’ll email you shortly. Don’t pay again.”</text>
<text x="960" y="730" class="t" font-weight="600">Blocked · “Check status”</text>
<rect x="40" y="756" width="1120" height="50" rx="10" fill="#F7F0E9" stroke="#E6DDD5"/>
<rect x="40" y="756" width="6" height="50" rx="3" fill="#FFA273"/>
<text x="58" y="786" class="mono">capture_failed</text>
<text x="250" y="786" class="t">authorized but capture fails (> 10 min)</text>
<text x="560" y="786" class="t">Email: “Hold released by your bank in 5–7 days”</text>
<text x="960" y="786" class="t" font-weight="600">New attempt allowed</text>
<rect x="40" y="812" width="1120" height="50" rx="10" fill="#fff" stroke="#E6DDD5"/>
<rect x="40" y="812" width="6" height="50" rx="3" fill="#FFA273"/>
<text x="58" y="842" class="mono">abandoned</text>
<text x="250" y="842" class="t">TTL expired · provider shows no payment</text>
<text x="560" y="842" class="t">Nothing live · cart kept (recovery email)</text>
<text x="960" y="842" class="t" font-weight="600">Cart restored</text>
<rect x="40" y="874" width="10" height="10" rx="2" fill="#FFA273"/><text x="58" y="884" class="s">retry allowed immediately (new attempt, new provider order)</text>
<rect x="440" y="874" width="10" height="10" rx="2" fill="#C43D3D"/><text x="458" y="884" class="s">retry blocked until reconcile resolves it (prevents double charge)</text>
<text x="40" y="908" class="s">Guards: POST /api/payments/intent checks existing attempts first · partial unique index (order_id) WHERE status IN (authorized, captured) · 5 attempts / order / 15 min.</text>
</svg>